<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#006b32">

  <link rel="manifest" href="./manifest.json">

  <title>Apna Mini Mart</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe
    src="https://script.google.com/macros/s/AKfycbzpDjTQ6qo67cSA9o0sJeeAefZwv3ErbOQLKYvcql7JyA08rqVPAA0QkvC_M7BTP2Y8/exec"
    allow="geolocation; payment"
    loading="eager">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js')
          .then(function () {
            console.log('PWA Service Worker registered');
          })
          .catch(function (error) {
            console.log('Service Worker error:', error);
          });
      });
    }
  </script>

</body>
</html>
