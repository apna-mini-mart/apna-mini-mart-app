<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#006b32">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.json">

  <title>Apna Mini Mart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      text-align: center;
      padding: 25px 20px;
    }

    .logo {
      width: 150px;
      height: 150px;
      margin: 0 auto 22px;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      color: #006b32;
      font-size: 32px;
    }

    .tagline {
      margin: 10px 0 28px;
      color: #555;
      font-size: 18px;
    }

    button,
    #openBtn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #installBtn {
      background: #ff6b00;
      color: white;
      display: none;
    }

    #openBtn {
      background: #006b32;
      color: white;
      text-decoration: none;
      display: block;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">
    <img src="./amm-icon-512.png" alt="Apna Mini Mart">
  </div>

  <h1>Apna Mini Mart</h1>

  <div class="tagline">
    Daily Needs, Always Near You
  </div>

  <button id="installBtn">
    📲 Install Apna Mini Mart
  </button>

  <a id="openBtn"
     href="https://script.google.com/a/*/macros/s/AKfycbzpDjTQ6qo67cSA9o0sJeeAefZwv3ErbOQLKYvcql7JyA08rqVPAA0QkvC_M7BTP2Y8/exec">
    🛒 Open Apna Mini Mart
  </a>

  <div class="note">
    Install करने के बाद Home Screen से सीधे खोलें
  </div>

</div>

<script>
  let deferredPrompt = null;

  // Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./service-worker.js")
        .then(function () {
          console.log("Service Worker registered");
        })
        .catch(function (error) {
          console.log("Service Worker error:", error);
        });
    });
  }

  // Install prompt
  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();

    deferredPrompt = event;

    document.getElementById("installBtn").style.display = "block";
  });

  document.getElementById("installBtn").addEventListener("click", async function () {

    if (!deferredPrompt) {
      return;
    }

    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;

    console.log("Install choice:", result.outcome);

    deferredPrompt = null;

    document.getElementById("installBtn").style.display = "none";
  });
</script>

</body>
</html>
